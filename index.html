<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mok Transports Services · Sales Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0d1f35;
  --navy2: #152a47;
  --navy3: #1e3a5f;
  --blue: #2d7dd2;
  --blue-light: #5fa3e8;
  --blue-pale: #ddeeff;
  --teal: #1aaf82;
  --teal-pale: #d6f5ec;
  --amber: #f5a623;
  --amber-pale: #fef3dc;
  --coral: #e85d3a;
  --coral-pale: #fde8e3;
  --purple: #7c5cbf;
  --purple-pale: #ede9f8;
  --pink: #d44f8a;
  --pink-pale: #fce8f2;
  --white: #ffffff;
  --off: #f7f8fc;
  --surface: #eef1f7;
  --border: rgba(13,31,53,0.10);
  --border2: rgba(13,31,53,0.18);
  --text: #0d1f35;
  --text2: #4a6080;
  --text3: #8fa3ba;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(13,31,53,0.08);
  --shadow-md: 0 4px 24px rgba(13,31,53,0.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--text);min-height:100vh;font-size:14px}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);position:relative;overflow:hidden}
#login-screen::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 60% 40%,rgba(45,125,210,0.18) 0%,transparent 70%),radial-gradient(ellipse 50% 50% at 10% 90%,rgba(26,175,130,0.12) 0%,transparent 60%);pointer-events:none}
.login-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:48px 40px;width:360px;position:relative;backdrop-filter:blur(20px)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.login-logo-icon{width:44px;height:44px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center}
.login-logo-text{color:#fff;font-size:18px;font-weight:600;line-height:1.1}
.login-logo-sub{color:rgba(255,255,255,0.45);font-size:11px;font-weight:400}
.login-title{color:rgba(255,255,255,0.9);font-size:22px;font-weight:600;margin-bottom:6px}
.login-sub{color:rgba(255,255,255,0.4);font-size:13px;margin-bottom:28px}
.role-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px}
.role-btn{padding:14px 8px;border-radius:var(--radius-sm);border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);cursor:pointer;text-align:center;transition:all .2s;color:rgba(255,255,255,0.6);font-family:inherit}
.role-btn:hover{border-color:rgba(45,125,210,0.5);background:rgba(45,125,210,0.1);color:#fff}
.role-btn.selected{border-color:var(--blue);background:rgba(45,125,210,0.2);color:#fff}
.role-btn-name{font-size:12px;font-weight:600;margin-bottom:2px}
.role-btn-title{font-size:10px;opacity:0.6}
.login-btn{width:100%;padding:14px;background:var(--blue);border:none;border-radius:var(--radius-sm);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.login-btn:hover{background:var(--blue-light)}
.login-divider{text-align:center;color:rgba(255,255,255,0.2);font-size:11px;margin:12px 0}

/* APP SHELL */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{background:var(--navy);height:56px;display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;position:sticky;top:0;z-index:50}
.tb-logo{display:flex;align-items:center;gap:10px;margin-right:8px}
.tb-logo-icon{width:30px;height:30px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center}
.tb-logo-text{color:#fff;font-size:14px;font-weight:600}
.tb-logo-sub{color:rgba(255,255,255,0.35);font-size:10px}
.tb-nav{display:flex;gap:2px;flex:1}
.tb-tab{padding:6px 14px;border-radius:6px;border:none;background:transparent;color:rgba(255,255,255,0.45);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.tb-tab:hover{color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.06)}
.tb-tab.active{color:#fff;background:rgba(255,255,255,0.12)}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.tb-user{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.7);font-size:12px}
.tb-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff}
.tb-logout{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.5);font-family:inherit;font-size:11px;cursor:pointer}
.tb-logout:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8)}
.add-deal-btn{padding:7px 14px;background:var(--blue);border:none;border-radius:var(--radius-sm);color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.add-deal-btn:hover{background:var(--blue-light)}

.main{flex:1;padding:24px;max-width:1400px;margin:0 auto;width:100%}
.view{display:none}.view.active{display:block}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:0;right:0;width:3px;height:100%;border-radius:0 3px 3px 0}
.stat-card.blue::after{background:var(--blue)}
.stat-card.teal::after{background:var(--teal)}
.stat-card.amber::after{background:var(--amber)}
.stat-card.coral::after{background:var(--coral)}
.stat-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace;letter-spacing:-.02em}
.stat-sub{font-size:11px;color:var(--text3);margin-top:3px}

/* PIPELINE */
.filters-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-label{font-size:11px;color:var(--text3);font-weight:500}
.fc{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s;font-weight:500}
.fc:hover{border-color:var(--blue);color:var(--blue)}
.fc.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.k-col{background:var(--surface);border-radius:var(--radius);padding:10px}
.k-col-hd{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.05em}
.k-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}
.k-cnt{font-size:10px;background:#fff;border-radius:10px;padding:2px 7px;color:var(--text3);font-family:'DM Mono',monospace}
.k-cards{min-height:100px;display:flex;flex-direction:column;gap:7px}
.deal-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;cursor:pointer;transition:all .2s;position:relative}
.deal-card:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.deal-card:hover .move-hint{opacity:1}
.move-hint{position:absolute;top:8px;right:8px;font-size:9px;color:var(--blue);opacity:0;transition:opacity .15s;font-weight:600}
.deal-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px;padding-right:20px}
.deal-value{font-size:12px;color:var(--text2);font-family:'DM Mono',monospace;margin-bottom:7px}
.deal-meta{display:flex;align-items:center;justify-content:space-between}
.agent-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.deal-date{font-size:10px;color:var(--text3)}
.ship-row{display:flex;align-items:center;gap:4px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.ship-pill{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500;display:flex;align-items:center;gap:4px}
.ship-dot{width:5px;height:5px;border-radius:50%}
.empty-col{text-align:center;padding:20px 10px;color:var(--text3);font-size:11px;font-style:italic}

/* AGENTS */
.agents-section{margin-bottom:24px}
.section-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.agent-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.a-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:box-shadow .2s}
.a-card:hover{box-shadow:var(--shadow-md)}
.a-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.a-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.a-name{font-size:14px;font-weight:600;color:var(--text)}
.a-role{font-size:11px;color:var(--text3)}
.a-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.a-stat{background:var(--off);border-radius:var(--radius-sm);padding:9px 10px;text-align:center}
.a-stat-v{font-size:15px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace}
.a-stat-l{font-size:10px;color:var(--text3);margin-top:2px}
.target-wrap{margin-bottom:14px}
.target-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px}
.target-labels span:last-child{font-family:'DM Mono',monospace;font-weight:500}
.prog-bg{background:var(--surface);border-radius:4px;height:7px;overflow:hidden}
.prog-fill{height:7px;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.activity-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.log-btn{font-size:10px;padding:3px 9px;border-radius:6px;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.log-btn:hover{background:var(--off);color:var(--blue)}
.act-list{display:flex;flex-direction:column;gap:5px;max-height:110px;overflow-y:auto}
.act-item{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--text2);padding:6px 8px;background:var(--off);border-radius:6px;line-height:1.4}
.act-dot{width:6px;height:6px;border-radius:50%;margin-top:4px;flex-shrink:0}

/* OWNER DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}
.dash-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.dash-card.wide{grid-column:span 2}
.dash-card.full{grid-column:span 3}
.dash-card-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.leaderboard{display:flex;flex-direction:column;gap:10px}
.lb-row{display:flex;align-items:center;gap:10px}
.lb-rank{font-size:11px;font-weight:700;color:var(--text3);width:16px;font-family:'DM Mono',monospace}
.lb-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:12px;font-weight:600;color:var(--text)}
.lb-meta{font-size:10px;color:var(--text3);margin-top:1px}
.lb-bar-wrap{width:100px;flex-shrink:0}
.lb-bar-bg{background:var(--surface);border-radius:4px;height:5px}
.lb-bar-fill{height:5px;border-radius:4px}
.lb-value{font-size:11px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace;min-width:70px;text-align:right}
.comparison-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comp-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.comp-row:last-child{border-bottom:none}
.comp-label{font-size:11px;color:var(--text2)}
.comp-vals{display:flex;gap:12px}
.comp-val{font-size:12px;font-weight:600;font-family:'DM Mono',monospace;text-align:right;min-width:60px}
.comp-header{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:8px}
.comp-agent-label{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:80px}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar{width:100%;border-radius:4px 4px 0 0;transition:height .4s;min-height:4px}
.chart-bar-label{font-size:9px;color:var(--text3);text-align:center}
.chart-bar-val{font-size:9px;font-weight:600;color:var(--text2);font-family:'DM Mono',monospace}
.pipeline-stage-row{display:flex;flex-direction:column;gap:7px}
.ps-row{display:flex;align-items:center;gap:8px}
.ps-label{font-size:11px;color:var(--text2);width:90px;flex-shrink:0}
.ps-bar-bg{flex:1;background:var(--surface);border-radius:4px;height:8px;overflow:hidden}
.ps-bar-fill{height:8px;border-radius:4px}
.ps-count{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);min-width:20px;text-align:right}
.ps-value{font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);min-width:65px;text-align:right}
.alerts-list{display:flex;flex-direction:column;gap:7px}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border-left:3px solid}
.alert-item.warn{background:var(--amber-pale);border-color:var(--amber)}
.alert-item.good{background:var(--teal-pale);border-color:var(--teal)}
.alert-item.info{background:var(--blue-pale);border-color:var(--blue)}
.alert-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.alert-body{font-size:11px;color:var(--text2);line-height:1.4}

/* CARRIERS */
.carrier-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.c-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.c-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.c-name{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.c-badge{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600}
.c-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.c-metric{background:var(--off);border-radius:var(--radius-sm);padding:10px 12px}
.c-metric-v{font-size:16px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace}
.c-metric-l{font-size:10px;color:var(--text3);margin-top:2px}
.c-routes-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.c-routes{display:flex;flex-direction:column;gap:5px}
.c-route{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;background:var(--off);border-radius:var(--radius-sm)}
.c-route-name{font-size:12px;font-weight:500;color:var(--text)}
.c-route-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.c-route-status{width:6px;height:6px;border-radius:50%}
.vs-bar{background:var(--off);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.vs-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.vs-rows{display:flex;flex-direction:column;gap:8px}
.vs-row{display:grid;grid-template-columns:120px 1fr 1fr;gap:8px;align-items:center}
.vs-label{font-size:11px;color:var(--text2)}
.vs-fill-wrap{display:flex;align-items:center;gap:6px;overflow:hidden}
.vs-fill{height:6px;border-radius:3px;transition:width .5s}
.vs-val{font-size:11px;font-family:'DM Mono',monospace;color:var(--text);font-weight:500;white-space:nowrap}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(13,31,53,0.5);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:24px;width:380px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{margin-bottom:0}
.fg.full{grid-column:span 2}
.fl{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.04em}
input[type=text],select,input[type=number]{width:100%;padding:9px 11px;font-size:13px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--off);color:var(--text);font-family:inherit;transition:border-color .15s}
input[type=text]:focus,select:focus,input[type=number]:focus{outline:none;border-color:var(--blue);background:#fff}
.modal-btns{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.btn-primary{padding:9px 20px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:var(--blue-light)}
.btn-secondary{padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:#fff;color:var(--text2);font-family:inherit;font-size:13px;cursor:pointer}
.btn-secondary:hover{background:var(--off)}

/* TIPS */
.tips-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.tips-header-title{font-size:16px;font-weight:600;color:var(--text)}
.tip-cats{display:flex;gap:6px;flex-wrap:wrap}
.tip-cat-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s;font-weight:500}
.tip-cat-btn:hover{border-color:var(--blue);color:var(--blue)}
.tip-cat-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tips-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tip-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:0;cursor:pointer;transition:all .2s;overflow:hidden}
.tip-card:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-1px)}
.tip-card-top{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px}
.tip-icon{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.tip-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.tip-body{font-size:11px;color:var(--text2);line-height:1.6}
.tip-steps{padding:0 16px 14px;display:flex;flex-direction:column;gap:5px}
.tip-step{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:var(--text2);line-height:1.5}
.tip-step-num{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px}
.tip-footer{padding:8px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.tip-cat-label{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.tip-expand{font-size:10px;color:var(--blue);font-weight:600}
.tip-card.expanded .tip-steps{display:flex}
.playbook-banner{background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.playbook-text{color:#fff}
.playbook-title{font-size:15px;font-weight:600;margin-bottom:4px}

      <div class="fg"><label class="fl">Value (R)</label><input type="number" id="f-val" placeholder="e.g. 75000"/></div>
      <div class="fg"><label class="fl">Agent</label><select id="f-agent"><option value="Neo">Neo Lumkwana</option><option value="Mavis">Mavis Selomana</option></select></div>
      <div class="fg"><label class="fl">Stage</label>
        <select id="f-stage"><option value="0">Prospecting</option><option value="1">Qualified</option><option value="2">Proposal</option><option value="3">Negotiation</option><option value="4">Closed won</option></select>
      </div>

          <option value="none">None yet</option>

            <option value="mok_national">Mok Fleet — National</option>
            <option value="mok_crossborder">Mok Fleet — Cross-border</option>
          </optgroup>
          <optgroup label="📦 Via booking.moktransports.com">
            <option value="JKJ">JKJ — Local (via Mok platform)</option>
            <option value="DHL">DHL — International Export/Import (via Mok platform)</option>
          </optgroup>
        </select>
      </div>

        <select id="f-ship"><option value="none">No shipment yet</option><option value="booked">Booked</option><option value="in_transit">In transit</option><option value="delivered">Delivered</option><option value="delayed">Delayed</option></select>
      </div>

        <div id="ship-help" style="font-size:11px;color:var(--text2);background:var(--off);border-radius:var(--radius-sm);padding:8px 10px;border:1px solid var(--border);line-height:1.6"></div>

const STAGES=[
  {id:'prospecting',label:'Prospecting',color:'#8fa3ba'},
  {id:'qualified',label:'Qualified',color:'#2d7dd2'},
  {id:'proposal',label:'Proposal',color:'#f5a623'},
  {id:'negotiation',label:'Negotiation',color:'#e85d3a'},

];
const AGENTS={
  Neo:{color:'#534ab7',bg:'#ede9f8',lbl:'NL',full:'Neo Lumkwana',target:200000},
  Mavis:{color:'#d44f8a',bg:'#fce8f2',lbl:'MS',full:'Mavis Selomana',target:200000}
};
const SHIP={

  booked:{label:'Booked',color:'#2d7dd2',bg:'#ddeeff'},

  delivered:{label:'Delivered',color:'#1aaf82',bg:'#d6f5ec'},
  delayed:{label:'Delayed',color:'#e85d3a',bg:'#fde8e3'}
};
const CARRIER_LABELS={
  none:'—',
  mok_national:'Mok Fleet · National',
  mok_crossborder:'Mok Fleet · Cross-border',
  JKJ:'JKJ · Local',
  DHL:'DHL · Intl'
};
const CARRIER_HELP={

  DHL:'✈️ DHL handles international exports and imports. Client books via booking.moktransports.com — ideal for cross-continental and air freight.'
};
function updateShipHelp(val){
  const row=document.getElementById('ship-help-row');
  const box=document.getElementById('ship-help');
  if(val&&val!=='none'&&CARRIER_HELP[val]){
    box.textContent=CARRIER_HELP[val];
    row.style.display='block';
  } else {
    row.style.display='none';
  }
}
const LOGS={
  Neo:[
    'Checkers Fleet discovery call completed — very interested',
    'SA Breweries DHL quote sent — awaiting approval',
    'Onboarded onto JKJ booking system — first booking done',
    'Cold-called 6 new prospects in Ekurhuleni'

  Mavis:[
    'Eskom Logistics cold call — follow-up scheduled',
    'Sasol Chemicals shipment booked via JKJ',
    'Joined route consolidation sales training',
    'Sent intro deck to 3 new prospects in Midrand'
  ]
};
let deals=[];
let nid=1;
let currentRole=null;
let currentFilter='all';

// ─── AUTH ────────────────────────────────────────────────────────────────────
function selectRole(r){
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('role-'+r).classList.add('selected');
  currentRole=r;
}
function doLogin(){
  if(!currentRole){alert('Please select a profile.');return;}
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  setupApp();
}
function logout(){
  currentRole=null;currentFilter='all';
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

// ─── APP SETUP ───────────────────────────────────────────────────────────────

  const av=document.getElementById('tb-avatar');
  const un=document.getElementById('tb-username');
  nav.innerHTML='';

  if(currentRole==='owner'){
    av.style.background='#2d7dd2';av.textContent='RM';
    un.textContent='Ryan Mokgethi';
    const tabs=[
      {id:'dashboard',label:'Dashboard'},
      {id:'pipeline',label:'Full pipeline'},
      {id:'agents',label:'Agents'},
      {id:'carriers',label:'Carriers'},
      {id:'tips',label:'Tips'}
    ];
    tabs.forEach((t,i)=>{
      const btn=document.createElement('button');
      btn.className='tb-tab'+(i===0?' active':'');
      btn.textContent=t.label;
      if(i===0){const b=document.createElement('span');b.className='owner-badge';b.textContent='Ryan Mokgethi';btn.appendChild(b);}
      btn.onclick=()=>switchView(t.id,btn);
      nav.appendChild(btn);
    });
    // Add deal btn
    const ab=document.createElement('button');
    ab.className='add-deal-btn';ab.textContent='+ New deal';
    ab.onclick=openModal;
    document.querySelector('.tb-right').insertBefore(ab,document.querySelector('.tb-user'));
    switchView('dashboard',nav.querySelector('.tb-tab'));
  } else {
    const a=AGENTS[currentRole==='neo'?'Neo':'Mavis'];
    const name=currentRole==='neo'?'Neo':'Mavis';
    av.style.background=a.color;av.textContent=a.lbl;
    un.textContent=a.full;
    const tabs=[
      {id:'mydeals',label:'My deals'},
      {id:'carriers',label:'Carriers'},
      {id:'tips',label:'My tips'}
    ];
    tabs.forEach((t,i)=>{
      const btn=document.createElement('button');
      btn.className='tb-tab'+(i===0?' active':'');
      btn.textContent=t.label;
      btn.onclick=()=>switchView(t.id,btn);
      nav.appendChild(btn);
    });
    const ab=document.createElement('button');
    ab.className='add-deal-btn';ab.textContent='+ Add deal';
    ab.onclick=openModal;
    document.querySelector('.tb-right').insertBefore(ab,document.querySelector('.tb-user'));
    switchView('mydeals',nav.querySelector('.tb-tab'));
  }
  renderAll();
}

function switchView(name,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tb-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='pipeline')renderPipeline();
  else if(name==='mydeals')renderMyDeals();
  else if(name==='agents')renderAgents();
  else if(name==='dashboard')renderDashboard();
  else if(name==='carriers')renderCarriers();
  else if(name==='tips')renderTips();
}

function renderAll(){
  renderStats();
  if(currentRole==='owner'){renderDashboard();renderAgents();}
  else{renderMyDeals();}
  renderCarriers();renderTips();
}

// ─── STATS ───────────────────────────────────────────────────────────────────
function fmt(v){return'R '+Math.round(v).toLocaleString('en-ZA')}
function renderStats(targetEl='stats-row',filterAgent=null){
  const d=filterAgent?deals.filter(x=>x.agent===filterAgent):deals;
  const open=d.filter(x=>!x.won);
  const won=d.filter(x=>x.won);
  const pipe=open.reduce((s,x)=>s+x.value,0);
  const wonV=won.reduce((s,x)=>s+x.value,0);
  const live=d.filter(x=>x.ship==='in_transit'||x.ship==='booked').length;
  const el=document.getElementById(targetEl);
  if(!el)return;
  el.innerHTML=`
    <div class="stat-card blue"><div class="stat-label">Pipeline value</div><div class="stat-value">${fmt(pipe)}</div><div class="stat-sub">${open.length} open deals</div></div>
    <div class="stat-card teal"><div class="stat-label">Won this month</div><div class="stat-value">${fmt(wonV)}</div><div class="stat-sub">${won.length} closed</div></div>
    <div class="stat-card amber"><div class="stat-label">Total deals</div><div class="stat-value">${d.length}</div><div class="stat-sub">all stages</div></div>
    <div class="stat-card coral"><div class="stat-label">Live shipments</div><div class="stat-value">${live}</div><div class="stat-sub">JKJ + DHL active</div></div>`;
}

// ─── PIPELINE ────────────────────────────────────────────────────────────────
function renderPipeline(){
  renderStats('stats-row');
  const fr=document.getElementById('filters-row');
  fr.innerHTML=`<span class="filter-label">Filter:</span>
    <button class="fc ${currentFilter==='all'?'active':''}" onclick="setFilter('all',this)">All agents</button>
    <button class="fc ${currentFilter==='Neo'?'active':''}" onclick="setFilter('Neo',this)">Neo</button>
    <button class="fc ${currentFilter==='Mavis'?'active':''}" onclick="setFilter('Mavis',this)">Mavis</button>`;
  renderKanban('kanban-board',currentFilter==='all'?null:currentFilter);
}
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('#filters-row .fc').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderKanban('kanban-board',f==='all'?null:f);
}
function renderMyDeals(){
  const name=currentRole==='neo'?'Neo':'Mavis';
  renderStats('my-stats-row',name);
  renderKanban('my-kanban-board',name);
}
function renderKanban(boardId,agentFilter){
  const board=document.getElementById(boardId);
  if(!board)return;
  board.innerHTML='';
  STAGES.forEach((st,si)=>{
    const fds=deals.filter(d=>d.stage===si&&(!agentFilter||d.agent===agentFilter));
    const col=document.createElement('div');
    col.className='k-col';
    col.innerHTML=`<div class="k-col-hd"><span><span class="k-dot" style="background:${st.color}"></span>${st.label}</span><span class="k-cnt">${fds.length}</span></div><div class="k-cards" id="${boardId}-c${si}"></div>`;
    board.appendChild(col);
    const cc=col.querySelector('.k-cards');
    if(!fds.length){cc.innerHTML='<div class="empty-col">No deals</div>';return;}
    fds.forEach(d=>{
      const a=AGENTS[d.agent];
      const ss=SHIP[d.ship||'none'];
      const card=document.createElement('div');
      card.className='deal-card';
      const shipRow=d.ship&&d.ship!=='none'?`<div class="ship-row"><div class="ship-pill" style="background:${ss.bg};color:${ss.color}"><div class="ship-dot" style="background:${ss.color}"></div>${CARRIER_LABELS[d.carrier]||d.carrier} · ${ss.label}</div></div>`:'';
      card.innerHTML=`<div class="move-hint">Click to advance →</div><div class="deal-name">${d.company}</div><div class="deal-value">${fmt(d.value)}</div><div class="deal-meta"><span class="agent-badge" style="background:${a.bg};color:${a.color}">${d.agent}</span><span class="deal-date">${d.date}</span></div>${shipRow}`;
      if(d.notes)card.title=d.notes;
      card.onclick=()=>advanceDeal(d,boardId,agentFilter);
      cc.appendChild(card);
    });
  });
}
function advanceDeal(d,boardId,af){
  if(d.stage>=4){alert(`"${d.company}" is already closed won.`);return;}
  const next=STAGES[d.stage+1].label;
  if(confirm(`Move "${d.company}" to "${next}"?`)){
    d.stage++;d.won=(d.stage===4);
    renderKanban(boardId,af);
    renderStats(boardId==='my-kanban-board'?'my-stats-row':'stats-row',af);
    if(currentRole==='owner'){renderDashboard();renderAgents();}
  }
}

// ─── AGENTS ──────────────────────────────────────────────────────────────────
function renderAgents(){
  const grid=document.getElementById('agent-cards');
  if(!grid)return;
  grid.innerHTML='';
  ['Neo','Mavis'].forEach(name=>{
    const a=AGENTS[name];
    const myD=deals.filter(d=>d.agent===name);
    const open=myD.filter(d=>!d.won);
    const won=myD.filter(d=>d.won);
    const wonV=won.reduce((s,d)=>s+d.value,0);
    const pipe=open.reduce((s,d)=>s+d.value,0);
    const wr=myD.length?Math.round(won.length/myD.length*100):0;
    const tgtPct=Math.min(100,Math.round(wonV/a.target*100));
    const barC=tgtPct>=70?'#1aaf82':tgtPct>=35?'#f5a623':'#e85d3a';
    const logs=LOGS[name]||[];
    const card=document.createElement('div');
    card.className='a-card';
    card.innerHTML=`
      <div class="a-top">
        <div class="a-avatar" style="background:${a.bg};color:${a.color}">${a.lbl}</div>

      </div>
      <div class="a-stats">

        <div class="a-stat"><div class="a-stat-v">${wr}%</div><div class="a-stat-l">Win rate</div></div>

      </div>
      <div class="target-wrap">
        <div class="target-labels"><span>Monthly target progress</span><span>${fmt(wonV)} / ${fmt(a.target)}</span></div>

      </div>
      <div class="activity-title">Recent activity <button class="log-btn" onclick="logAct('${name}')">+ Log</button></div>
      <div class="act-list" id="act-${name}">
        ${logs.map(l=>`<div class="act-item"><span class="act-dot" style="background:${a.color}"></span><span>${l}</span></div>`).join('')}
      </div>`;
    grid.appendChild(card);
  });

function logAct(name){
  const txt=prompt(`Log activity for ${name}:`);

    renderAgents();
  }

let activeTipCat='all';
function renderTips(){
  const view=document.getElementById('view-tips');
  if(!view)return;
  view.innerHTML=`
    <div class="playbook-banner">
      <div class="playbook-text">
        <div class="playbook-title">Mok Transports · Sales Playbook</div>
        <div class="playbook-sub">Step-by-step coaching for Neo and Mavis to find, pitch and close logistics clients — including Mok Transports Services' own fleet contracts</div>
      </div>
      <div class="playbook-icon">🚛</div>
    </div>
    <div class="tips-header">
      <div class="tips-header-title">All coaching tips <span style="font-size:12px;font-weight:400;color:var(--text3)">(${TIPS_DATA.length} tips)</span></div>
      <div class="tip-cats">
        <button class="tip-cat-btn active" onclick="filterTips('all',this)">All</button>
        <button class="tip-cat-btn" onclick="filterTips('prospecting',this)">🎯 Prospecting</button>
        <button class="tip-cat-btn" onclick="filterTips('fleet',this)">🚚 Own Fleet</button>
        <button class="tip-cat-btn" onclick="filterTips('coldcall',this)">📞 Cold Calling</button>
        <button class="tip-cat-btn" onclick="filterTips('closing',this)">🤝 Closing</button>
      </div>
    </div>
    <div class="tips-grid" id="tips-grid"></div>`;
  renderTipCards();
}
function filterTips(cat,btn){
  activeTipCat=cat;
  document.querySelectorAll('.tip-cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTipCards();
}
function renderTipCards(){
  const grid=document.getElementById('tips-grid');
  if(!grid)return;
  const filtered=activeTipCat==='all'?TIPS_DATA:TIPS_DATA.filter(t=>t.cat===activeTipCat);
  grid.innerHTML='';
  filtered.forEach((t,i)=>{
    const card=document.createElement('div');
    card.className='tip-card';
    card.innerHTML=`
      <div class="tip-card-top">
        <div class="tip-icon" style="background:${t.bg}">${t.icon}</div>
        <div><div class="tip-title">${t.title}</div><div class="tip-body">${t.body}</div></div>
      </div>
      <div class="tip-steps">
        ${t.steps.map((s,si)=>`<div class="tip-step"><div class="tip-step-num" style="background:${t.catColor}">${si+1}</div><span>${s}</span></div>`).join('')}
      </div>
      <div class="tip-footer">
        <span class="tip-cat-label" style="background:${t.catBg};color:${t.catColor}">${t.catLabel}</span>
      </div>`;
    grid.appendChild(card);
  });
}

  const co=document.getElementById('f-co').value.trim();
  const val=parseFloat(document.getElementById('f-val').value);
  const agent=document.getElementById('f-agent').value;
  const stage=parseInt(document.getElementById('f-stage').value);

  const notes=document.getElementById('f-notes').value.trim();
  if(!co||!val){alert('Please enter a company name and value.');return;}
  const today=new Date();
  const dateStr=today.toLocaleDateString('en-ZA',{day:'numeric',month:'short'});
  deals.push({id:nid++,company:co,value:val,agent,stage,carrier,ship,won:stage===4,date:dateStr,notes});
  document.getElementById('deal-modal').classList.remove('open');
  ['f-co','f-val','f-notes'].forEach(id=>document.getElementById(id).value='');
  renderAll();
  const activeView=document.querySelector('.view.active');
  if(activeView){

    if(id==='view-pipeline')renderPipeline();
